name: Foundation Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate architecture scenario files
        run: |
          set -euo pipefail
          for file in eval/scenarios/*.json; do
            python3 scripts/eval_scenarios.py "$file" >/dev/null
            echo "validated $file"
          done

      - name: Validate workflow syntax
        uses: rhysd/actionlint@v1
